<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f8" />
    <meta name="description" content="Tus finanzas personales, con tus datos bajo tu control." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Finanzas</title>
  </head>
  <body>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('finanzas.theme') || 'system';
          const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#10151b' : '#f6f7f8');
        } catch {
          document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
